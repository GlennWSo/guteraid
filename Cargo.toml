[package]
name = "guteraid"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.19.1", features = ["dynamic_linking"] }
bevy-inspector-egui = "0.37.0"
bevy_firefly = "0.19.0"
rand_core = "0.10"
bevy_rand = "0.15"
bevy_prng = { version = "0.15", features = ["chacha20", "wyrand"] }

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3
